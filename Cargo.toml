[package]
name = "emailgrid"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }    # enables #[derive(Serialize)]
tera = "1.20.1"
serde_json = "1.0.149"
async-trait = "0.1.89"
anyhow = "1.0.102"
base64 = "0.23.1"
tokio = { version = "1.54.1", features = ["fs"] }
http = "1.5.0"
tracing = "0.1.44"
lettre = { version = "0.11", default-features = false, features = [
    "builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"
] }

